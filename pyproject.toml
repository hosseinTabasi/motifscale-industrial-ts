[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motifscale"
version = "0.1.0"
description = "Budgeted coreset motif dictionaries for explainable industrial multivariate time series"
authors = [{name = "Hossein Tabasi"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "scipy", "matplotlib", "stumpy", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
